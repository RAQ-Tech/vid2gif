# Lint configuration. The project has no pyproject.toml because the app is not
# packaged, so ruff reads its settings from here.

target-version = "py311"
line-length = 120
extend-exclude = ["app/static/vendor"]

[lint]
# E/W  pycodestyle, F pyflakes (unused and undefined names), B bugbear
# (correctness traps such as closures over loop variables).
select = ["E", "W", "F", "B"]

# E501 (line too long) is not enforced. 1267 lines exceed the default limit and
# rewrapping them across maintenance.py, video_preview_maintenance.py, and
# poster_maintenance.py would be a large diff through safety-critical code for
# no behavioural gain. Adopting a formatter is the way to fix this properly, and
# that is a separate decision -- see BACKLOG.md.
ignore = ["E501"]

[lint.per-file-ignores]
# Test modules append the repository root to sys.path before importing `app`,
# so their imports legitimately follow executable statements.
"tests/*" = ["E402"]
