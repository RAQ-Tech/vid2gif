# Lint configuration. The project has no pyproject.toml because the app is not
# packaged, so ruff reads its settings from here.

target-version = "py311"
line-length = 120
extend-exclude = ["app/static/vendor"]

[lint]
# E/W  pycodestyle, F pyflakes (unused and undefined names), B bugbear
# (correctness traps such as closures over loop variables), C901 mccabe
# (functions that have grown past the point of being safely changeable).
select = ["E", "W", "F", "B", "C901"]

# E501 (line too long) is enforced at the 120 columns above. `ruff format` keeps
# it that way; the three lines it could not wrap -- long f-strings -- were split
# by hand. Nothing is ignored here.
ignore = []

[lint.mccabe]
# Cyclomatic complexity ceiling. Functions already above it carry an explicit
# `# noqa: C901`, so `ruff check .` is clean today -- this is a ratchet against new
# tangle, not a demand to refactor on the spot. Those noqa comments are the debt
# list; the worst are build_duplicate_cleanup_plan and apply_duplicate_cleanup_plan
# in app/maintenance.py, both on the path that deletes files.
max-complexity = 15

[lint.per-file-ignores]
# Test modules append the repository root to sys.path before importing `app`,
# so their imports legitimately follow executable statements.
"tests/*" = ["E402"]

[format]
# Formatting is checked in CI with `ruff format --check .`. Adopting it was a
# 5,000-line mechanical diff across 59 files; every file's parsed syntax tree was
# compared before and after and came back identical, so nothing about behaviour
# changed. Run `ruff format .` before committing rather than hand-aligning code.
quote-style = "preserve"
