name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      STATE_ROOT: /tmp/vid2gif-state
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Prepare test directories
        run: mkdir -p "$STATE_ROOT"

      # Without these, the two GIF frame regression tests and the gifsicle
      # optimization test skip -- so the checks that confirm the app's headline
      # feature produces correct frames run nowhere. The Docker image installs
      # the same three tools.
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg gifsicle

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

      # Dev tools never reach the published image, but an advisory against one
      # still lands on the default branch and on every contributor's machine.
      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Test and build frontend
        run: |
          npm run test:frontend
          npm run build:frontend
          git diff --exit-code -- app/static

      # --cov-fail-under guards against silent erosion; it sits below the
      # current figure so an ordinary change has room, and is meant to be
      # raised as coverage improves rather than lowered to fit a regression.
      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run browser and accessibility tests
        run: npm run test:browser

  build-and-push:
    # The image is only built after the full test suite passes, so a commit
    # that breaks tests can never publish :latest to GHCR.
    needs: [tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/vid2gif
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Capture build time
        id: build-time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
